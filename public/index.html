<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>익명 건의함</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-xl mx-auto space-y-6">
    
    <!-- 헤더 -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-1">
      <span class="inline-block bg-emerald-50 text-emerald-600 text-xs font-bold px-2.5 py-1 rounded-full">DB 영구 저장 및 100% 익명 보장</span>
      <h1 class="text-2xl font-bold text-slate-900">📬 학생 익명 건의함</h1>
      <p class="text-xs text-slate-500">작성자의 개인정보 및 접속 기록을 일절 수집하지 않습니다.</p>
    </header>

    <!-- 건의 작성 폼 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-base font-bold text-slate-900">의견 남기기</h2>
      
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">카테고리</label>
        <select id="category" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="시설/환경">시설/환경</option>
          <option value="수업/학습">수업/학습</option>
          <option value="급식/편의">급식/편의</option>
          <option value="기타">기타</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">건의 내용</label>
        <textarea id="content" rows="4" placeholder="학교 생활 중 개선이 필요한 점이나 솔직한 의견을 자유롭게 작성해 주세요." class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
      </div>

      <button onclick="submitSuggestion()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg text-sm transition-colors shadow-sm">
        🔒 익명으로 제출하기
      </button>
    </div>

    <!-- 등록된 건의 목록 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-base font-bold text-slate-900">등록된 건의 목록</h2>
      <div id="suggestionList" class="space-y-3">
        <!-- 동적 카드 출력 -->
      </div>
    </div>

  </div>

  <script>
    async function loadSuggestions() {
      try {
        const res = await fetch('/api/suggestions');
        const data = await res.json();
        const container = document.getElementById('suggestionList');

        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = '<p class="text-slate-400 text-center py-6 text-xs">등록된 건의가 없습니다.</p>';
          return;
        }

        container.innerHTML = data.map(item => {
          const dateStr = new Date(item.created_at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
          return `
            <div class="p-4 rounded-xl bg-slate-50 border border-slate-100 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${item.category}</span>
                <span class="text-xs text-slate-400">${dateStr}</span>
              </div>
              <p class="text-slate-700 text-sm whitespace-pre-wrap leading-relaxed">${item.content}</p>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('데이터 로드 실패:', err);
      }
    }

    async function submitSuggestion() {
      const category = document.getElementById('category').value;
      const content = document.getElementById('content').value;

      if (!content.trim()) {
        alert('내용을 입력해 주세요.');
        return;
      }

      try {
        const res = await fetch('/api/suggestions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify({ category, content })
        });

        const result = await res.json();
        if (res.ok) {
          alert(result.message);
          document.getElementById('content').value = '';
          loadSuggestions();
        } else {
          alert(result.error);
        }
      } catch (err) {
        alert('전송 중 오류가 발생했습니다.');
      }
    }

    loadSuggestions();
  </script>
</body>
</html>
